[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-tool"
version = "1.0.0"
description = "Foreign trade product catalog & quotation tool"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pdfplumber>=0.10",
    "PyMuPDF>=1.23",
    "requests>=2.31",
    "python-docx>=1.0",
    "weasyprint>=60",
    "jinja2>=3.1",
    "watchdog>=3.0",
    "Pillow>=10.0",
]
